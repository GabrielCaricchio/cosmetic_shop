services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmetics_postgres
    environment:
      POSTGRES_DB: cosmetics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cosmetics_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Back/Dockerfile
    container_name: cosmetics_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/cosmetics_db
      DATABASE_READ_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/cosmetics_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev_cosmetic_shop_super_secret_jwt_key_2026
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./Front
      dockerfile: Dockerfile
    container_name: cosmetics_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
