$kind: http-request
name: Acessar /me sem Token (Teste 401 Unauthorized)
url: "{{baseUrl}}/api/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code é 401 Unauthorized sem token", function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 6000
