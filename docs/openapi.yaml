        client_id:
          type: integer
          title: Client Id
          description: ID da cliente compradora.
          examples:
          - 1
        total_amount:
          type: string
          title: Total Amount
          description: Valor total do pedido em BRL.
          examples:
          - 99.8
        status:
          type: string
          title: Status
          description: Status atual no ciclo de vida (pending, paid, preparing, shipped,
            delivered, cancelled).
