        description: 'Chave completa da reserva no Redis (ex: stock:reserved:order-uuid:1).'
      responses:
        '200':
          description: Trava liberada com sucesso e estoque restituído ao Redis.
          content:
            application/json:
              schema: {}
              example:
                message: Trava stock:reserved:order123:1 liberada com sucesso.
        '401':
          description: Não autorizado (token JWT ausente, expirado ou assinatura inválida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '403':
          description: Acesso proibido (usuário autenticado não possui o papel/role
            necessário para este recurso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AddCartItemRequest:
      properties:
        product_id:
          type: integer
          title: Product Id
          description: ID do cosmético a ser adicionado ao carrinho.
          examples:
          - 1
        quantity:
          type: integer
          minimum: 1.0
          title: Quantity
          description: Quantidade a ser incrementada.
          default: 1
          examples:
          - 1
      type: object
      required:
      - product_id
      title: AddCartItemRequest
      example:
        product_id: 1
        quantity: 1
    AdminLoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: E-mail corporativo do administrador ou gestor da plataforma.
          examples:
          - admin@auracosmeticos.com.br
        password:
          type: string
          title: Password
          description: Senha do administrador protegida com hash Argon2id.
          examples:
          - AdminSuperSeguro#2026
      type: object
      required:
      - email
      - password
      title: AdminLoginRequest
      example:
        email: admin@auracosmeticos.com.br
        password: AdminSuperSeguro#2026
    CartDTO:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CartItemDTO'
          type: array
          title: Items
          description: Lista de itens presentes no carrinho.
          default: []
        total_amount:
          type: string
          title: Total Amount
          description: Valor total acumulado dos itens no carrinho em BRL.
          default: '0.00'
          examples:
          - 99.8
        total_items:
          type: integer
          title: Total Items
          description: Soma de todas as quantidades de itens no carrinho.
          default: 0
          examples:
          - 2
      type: object
      title: CartDTO
      example:
        items:
        - image_url: https://images.unsplash.com/photo-1586495777744-4413f21062fa
          name: Batom Matte Velvet Red
          price: 49.9
          product_id: 1
          quantity: 2
          subtotal: 99.8
        total_amount: 99.8
        total_items: 2
    CartItemDTO:
      properties:
        product_id:
          type: integer
          title: Product Id
          description: ID do produto no carrinho.
          examples:
          - 1
        name:
          type: string
          title: Name
          description: Nome do cosmético.
          examples:
          - Batom Matte Velvet Red
        price:
          type: string
          title: Price
          description: Preço unitário em BRL.
          examples:
          - 49.9
        quantity:
          type: integer
          minimum: 1.0
          title: Quantity
          description: Quantidade selecionada.
          examples:
          - 2
        subtotal:
          type: string
          title: Subtotal
          description: Subtotal calculado (preço * quantidade).
          examples:
          - 99.8
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
          description: URL da imagem principal.
          examples:
          - https://images.unsplash.com/photo-1586495777744-4413f21062fa
      type: object
      required:
      - product_id
      - name
      - price
      - quantity
      - subtotal
      title: CartItemDTO
    CategoryResponse:
      properties:
        category_id:
          type: integer
          title: Category Id
          description: ID sequencial único da categoria.
          examples:
          - 1
        name:
          type: string
          title: Name
          description: Nome da categoria.
          examples:
          - Cuidados com a Pele
        slug:
          type: string
          title: Slug
          description: Slug amigável para SEO e filtros de vitrine.
          examples:
          - cuidados-com-a-pele
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Data e hora de criação da categoria.
      type: object
      required:
      - category_id
      - name
      - slug
      - created_at
      title: CategoryResponse
      example:
        category_id: 1
        created_at: '2026-11-16T08:00:00Z'
        name: Cuidados com a Pele
        slug: cuidados-com-a-pele
    CheckoutItemDTO:
      properties:
        product_id:
          type: integer
          title: Product Id
          description: ID do produto.
          examples:
          - 1
        quantity:
          type: integer
          minimum: 1.0
          title: Quantity
          description: Quantidade comprada.
          examples:
          - 2
      type: object
      required:
      - product_id
      - quantity
      title: CheckoutItemDTO
    CheckoutRequestDTO:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CheckoutItemDTO'
          type: array
          minItems: 1
          title: Items
          description: Lista de cosméticos para fechar o pedido.
        shipping_address:
          $ref: '#/components/schemas/ShippingAddressDTO'
          description: Endereço de entrega completo.
        payment_method:
          type: string
          title: Payment Method
          description: Método de pagamento ('pix' ou 'credit_card').
          default: pix
          examples:
          - pix
        customer:
          anyOf:
          - $ref: '#/components/schemas/CustomerDTO'
          - type: 'null'
          description: Dados do cliente para checkout direto ou guest.
      type: object
      required:
      - items
      - shipping_address
      title: CheckoutRequestDTO
      example:
        items:
        - product_id: 1
          quantity: 2
        payment_method: pix
        shipping_address:
          city: São Paulo
          complement: Apto 42B
          neighborhood: Bela Vista
          number: '1000'
          state: SP
          street: Avenida Paulista
          zip_code: 01310-100
    CheckoutResponseDTO:
      properties:
        order_id:
          type: string
          title: Order Id
          description: UUID identificador único do pedido gerado.
          examples:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        total_amount:
          type: string
          title: Total Amount
          description: Valor total consolidado do pedido em BRL.
          examples:
          - 99.8
        status:
          type: string
          title: Status
          description: Status inicial do pedido ('pending').
          examples:
          - pending
        payment_method:
          type: string
          title: Payment Method
          description: Método de pagamento selecionado.
          examples:
          - pix
        pix_qr_code_base64:
          anyOf:
          - type: string
          - type: 'null'
          title: Pix Qr Code Base64
          description: Imagem do QR Code Pix em Base64 (Data URI) para leitura visual.
        pix_copy_paste:
          anyOf:
          - type: string
          - type: 'null'
          title: Pix Copy Paste
          description: Código Pix Copia e Cola (EMVCo) para pagamento no app do banco.
          examples:
          - 00020126580014br.gov.bcb.pix...
        expires_at:
          type: string
          title: Expires At
          description: Data/hora ISO 8601 de expiração do pagamento e reserva de estoque.
          examples:
          - '2026-11-16T09:15:00Z'
      type: object
      required:
      - order_id
      - total_amount
      - status
      - payment_method
      - expires_at
      title: CheckoutResponseDTO
      example:
        expires_at: '2026-11-16T09:15:00Z'
        order_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        payment_method: pix
        pix_copy_paste: 00020126580014br.gov.bcb.pix01363fa85f64-5717-4562-b3fc-2c963f66afa65204000053039865400599.805802BR5925COSMETICOS
          MULTIMARCA6009SAO PAULO62070503***6304ABCD
        pix_qr_code_base64: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=
        status: pending
        total_amount: 99.8
    CustomerDTO:
      properties:
        name:
          type: string
          title: Name
          description: Nome completo da cliente.
          examples:
          - Maria Silva
        email:
          type: string
          format: email
          title: Email
          description: E-mail de contato.
          examples:
          - maria.silva@exemplo.com
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
          description: Telefone / WhatsApp.
          examples:
          - '11987654321'
        cpf:
          anyOf:
          - type: string
          - type: 'null'
          title: Cpf
          description: Número de CPF.
          examples:
          - 123.456.789-00
        lgpd_consent:
          type: boolean
          title: Lgpd Consent
          description: Consentimento LGPD.
          default: true
          examples:
          - true
      type: object
      required:
      - name
      - email
      title: CustomerDTO
    DailySalesChartPoint:
      properties:
        date:
          type: string
          title: Date
          description: Data no formato AAAA-MM-DD.
          examples:
          - '2026-11-16'
        amount:
          type: string
          title: Amount
          description: Volume financeiro transacionado no dia em BRL.
          examples:
          - 12340.0
        orders_count:
          type: integer
          title: Orders Count
          description: Número de pedidos fechados no dia.
          examples:
          - 115
      type: object
      required:
      - date
      - amount
      - orders_count
      title: DailySalesChartPoint
    DirectCheckoutRequestDTO:
      properties:
        product_id:
          type: integer
          title: Product Id
          description: ID do produto para compra imediata (1-Click Buy Now).
          examples:
