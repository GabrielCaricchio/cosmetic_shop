    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
          description: JSON Web Token (JWT) assinado com HMAC-SHA256 para autenticação
            nas rotas protegidas.
          examples:
          - eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          title: Token Type
          description: Tipo do token para uso no header Authorization (sempre 'bearer').
          default: bearer
          examples:
          - bearer
        role:
          type: string
          title: Role
          description: Papel do usuário no sistema ('client' para clientes ou 'Admin'/'SuperAdmin'
            para gestores).
          examples:
          - client
        user_id:
          type: integer
          title: User Id
          description: Identificador numérico único do usuário no banco de dados.
          examples:
          - 1
        name:
          type: string
          title: Name
          description: Nome cadastrado do usuário.
          examples:
          - Ana Beatriz Silva
        user:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: User
          description: Dados resumidos do perfil do usuário para frontend.
          examples:
          - id: 1
            name: Ana Beatriz Silva
            role: client
      type: object
      required:
      - access_token
      - role
      - user_id
      - name
      title: TokenResponse
      example:
        access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIiwicm9sZSI6ImNsaWVudCIsImV4cCI6MTc5NDU2MDAwMH0.signature
        name: Ana Beatriz Silva
        role: client
        token_type: bearer
        user_id: 1
