openapi: 3.1.0
info:
  title: Aura Cosméticos — API de E-Commerce & Marketplace
  description: "\n# \U0001F484 Aura Cosméticos — API de E-Commerce & Marketplace de\
    \ Alta Escala\n\nPlataforma full-stack desacoplada projetada para alta conversão\
    \ mobile, busca inteligente e resiliência extrema em concorrência de estoque.\n\
    \n---\n\n## \U0001F3DB️ Diferenciais Arquiteturais\n\n### 1. \U0001F50D Busca\
    \ Fuzzy Inteligente via `pg_trgm` (PostgreSQL)\nCosméticos possuem nomes técnicos,\
    \ estrangeiros e variações ortográficas frequentes (ex: *\"batom vermêlho\"*,\
    \ *\"shampô hidratante\"*, *\"serum hialuronico\"*). \nA plataforma utiliza a\
    \ extensão `pg_trgm` com índices **GiST Trigram Ops**, garantindo buscas instantâneas\
    \ com tolerância a erros tipográficos e acentuação.\n\n### 2. ⚡ Reserva Atômica\
    \ Anti-Overselling com Redis Lua Script\nPara evitar *race conditions* quando\
    \ múltiplos clientes tentam comprar a última unidade do produto:\n- O estoque\
    \ é reservado no **Redis via Lua Script Atômico**.\n- Em compras simultâneas,\
    \ exatamente um cliente obtém a reserva e os demais recebem imediatamente `409\
    \ Conflict / Esgotado`.\n- As reservas possuem TTL de 30 minutos (1800s), sendo\
    \ confirmadas no pagamento ou liberadas no cancelamento/expiração.\n\n### 3. \U0001F6E1\
    ️ Idempotência de Pagamentos e Compras\nO endpoint de checkout aceita o cabeçalho\
    \ `Idempotency-Key` (UUID). Requisições repetidas com a mesma chave em uma janela\
    \ de 24 horas retornam o resultado original cacheado no Redis sem duplicar pedidos\
    \ ou débitos.\n\n### 4. \U0001F510 Autenticação Robusta & RBAC\n- **Clientes**:\
    \ Registro com consentimento LGPD, senhas com hash **Argon2id** e tokens **JWT\
    \ (Bearer)** com 24 horas de validade.\n- **Backoffice**: Acesso restrito a gestores\
    \ com roles `Admin` e `SuperAdmin`.\n\n---\n\n## \U0001F4CB Códigos e Convenções\
    \ de Erro HTTP\n\nTodos os erros da aplicação seguem o formato padronizado:\n\n\
    ```json\n{\n  \"error\": \"NOME_DO_ERRO\",\n  \"message\": \"Descrição amigável\
    \ em português\",\n  \"details\": null\n}\n```\n\n| Código | Significado | Exemplo\
    \ de Causa |\n|---|---|---|\n| `400 Bad Request` | Requisição malformada | Parâmetros\
    \ inválidos ou incompatíveis |\n| `401 Unauthorized` | Autenticação necessária\
    \ | Token JWT ausente, expirado ou inválido |\n| `403 Forbidden` | Permissão insuficiente\
    \ | Cliente tentando acessar rota administrativa |\n| `404 Not Found` | Recurso\
    \ não localizado | Produto, pedido ou categoria inexistente |\n| `409 Conflict`\
    \ | Conflito de estado / Concorrência | Estoque esgotado via trava Redis ou e-mail\
    \ já cadastrado |\n| `422 Unprocessable` | Validação de Schema | Campo obrigatório\
    \ não enviado ou tipo incorreto |\n"
  termsOfService: https://auracosmeticos.com.br/termos
  contact:
    name: Equipe de Engenharia Aura Cosméticos
    url: https://auracosmeticos.com.br/
    email: dev@auracosmeticos.com.br
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Ambiente de Desenvolvimento Local
- url: https://api.auracosmeticos.com.br
  description: Ambiente de Produção (HTTPS)
paths:
  /api/health:
    get:
      tags:
      - Health
      summary: Verificar saúde da API (Health Check)
      description: Endpoint leve para verificação de liveness e readiness por balanceadores
        de carga, probes do Kubernetes e monitoramento de uptime.
      operationId: health_check_api_health_get
      responses:
        '200':
          description: Serviço operacional e saudável.
          content:
            application/json:
              schema: {}
              example:
                status: healthy
                service: cosmetics-ecommerce
                version: 1.0.0
  /api/register:
    post:
      tags:
      - Auth
      summary: Cadastrar nova cliente
      description: 'Cria uma nova conta de cliente na plataforma com hashing seguro
        de senha via Argon2id e registro explícito do consentimento LGPD.

        Retorna imediatamente o token JWT de acesso e perfil da cliente para login
        automático.'
      operationId: register_api_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientRequest'
        required: true
      responses:
        '201':
          description: Cliente cadastrada com sucesso e token JWT emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Requisição inválida (parâmetros ausentes, formato incorreto
            ou regra de negócio violada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '409':
          description: E-mail já cadastrado na plataforma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '422':
          description: Erro de validação semântica nos campos da requisição (Pydantic
            Validation Error).
  /api/login:
    post:
      tags:
      - Auth
      summary: Autenticar cliente (Login)
      description: 'Realiza a autenticação da cliente verificando e-mail e hash da
        senha com Argon2id.

        Retorna o token de acesso Bearer JWT com validade de 24 horas.'
      operationId: login_api_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Autenticação bem-sucedida com emissão do token JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciais incorretas (e-mail inexistente ou senha inválida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '422':
          description: Erro de validação semântica nos campos da requisição (Pydantic
            Validation Error).
  /api/me:
    get:
      tags:
      - Auth
      summary: Obter perfil da cliente autenticada
      description: 'Retorna os dados cadastrais da cliente atualmente autenticada
        a partir do token Bearer JWT informado no cabeçalho `Authorization: Bearer
        <token>`.'
      operationId: get_me_api_me_get
      responses:
        '200':
          description: Perfil da cliente autenticada recuperado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Não autorizado (token JWT ausente, expirado ou assinatura inválida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '403':
          description: Acesso proibido (usuário autenticado não possui o papel/role
            necessário para este recurso).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Recurso não encontrado (produto, pedido, categoria ou carrinho
            inexistente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
      security:
      - HTTPBearer: []
  /api/categories:
    get:
      tags:
      - Catalog
      summary: Listar categorias de cosméticos
      description: 'Retorna todas as categorias ativas cadastradas na plataforma (ex:
        Maquiagem, Cuidados com a Pele, Cabelos, Perfumaria), ordenadas por nome para
        navegação na vitrine e filtros rápidos.'
      operationId: list_categories_api_categories_get
      responses:
        '200':
          description: Lista de categorias ativas recuperada com sucesso.
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CategoryResponse'
                type: array
                title: Response 200 List Categories Api Categories Get
  /api/products:
    get:
      tags:
      - Catalog
      summary: Buscar e filtrar produtos no catálogo (Fuzzy Search via pg_trgm)
      description: 'Pesquisa cosméticos na vitrine com suporte a:

        - **Busca Fuzzy Trigram (`pg_trgm`)**: Tolerância a erros ortográficos, variações
        fonéticas e acentuações (ex: *"batom vermêlho"*, *"shampô hidratação"*).

        - **Filtros Combinados**: Por categoria (`category_id`), faixa de preço mínima
        (`min_price`) e máxima (`max_price`).

        - **Paginação Eficiente**: Controle de `page` e `limit` com totalizadores
        para navegação infinita ou paginada.'
      operationId: list_products_api_products_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Número da página (iniciando em 1).
          default: 1
          title: Page
        description: Número da página (iniciando em 1).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Itens por página (entre 1 e 100).
          default: 20
          title: Limit
        description: Itens por página (entre 1 e 100).
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Termo livre de busca textual com tolerância a erros.
          title: Search
        description: Termo livre de busca textual com tolerância a erros.
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Alias para termo de busca textual.
          title: Q
        description: Alias para termo de busca textual.
      - name: category_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Filtrar por identificador único de categoria.
          title: Category Id
        description: Filtrar por identificador único de categoria.
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtrar por ID ou slug de categoria.
          title: Category
        description: Filtrar por ID ou slug de categoria.
      - name: min_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          - type: 'null'
          description: Preço mínimo em BRL.
          title: Min Price
        description: Preço mínimo em BRL.
      - name: max_price
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          - type: 'null'
          description: Preço máximo em BRL.
          title: Max Price
        description: Preço máximo em BRL.
      responses:
        '200':
          description: Página de produtos e metadados de paginação calculados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductsResponse'
        '422':
          description: Erro de validação semântica nos campos da requisição (Pydantic
            Validation Error).
  /api/products/{id_or_slug}:
    get:
      tags:
      - Catalog
      summary: Obter detalhes de um cosmético por ID ou Slug (PDP)
      description: 'Recupera as informações completas de um produto para exibição
        na página de detalhes (Product Detail Page - PDP):

        - Informações comerciais (Nome, Marca, Preço, Fotos).

        - Informações dermatológicas (Ingredientes/Composição INCI e Modo de Uso).

        - Saldo disponível em estoque para validação de compra.

        Pode ser consultado tanto pelo ID numérico (ex: `1`) quanto pelo slug de URL
        (ex: `batom-matte-velvet-red`).'
      operationId: get_product_api_products__id_or_slug__get
      parameters:
      - name: id_or_slug
        in: path
        required: true
        schema:
          type: string
          description: ID numérico ou slug textual do produto.
          examples:
          - batom-matte-velvet-red
          title: Id Or Slug
        description: ID numérico ou slug textual do produto.
      responses:
        '200':
          description: Detalhes completos do produto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Cosmético não encontrado ou inativo no catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/cart:
    get:
      tags:
      - Cart
      summary: Obter carrinho de compras da sessão
      description: 'Recupera os itens, quantidades, subtotais calculados e valor total
        consolidado do carrinho de compras armazenado em cache volátil no Redis (TTL
        de 7 dias).

        Identificado pelo cabeçalho `X-Cart-ID`.'
      operationId: view_cart_api_cart_get
      parameters:
      - name: X-Cart-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: UUID identificador da sessão de carrinho no Redis. Se não enviado,
            um novo é gerado e retornado no cabeçalho X-Cart-ID da resposta.
          title: X-Cart-Id
        description: UUID identificador da sessão de carrinho no Redis. Se não enviado,
          um novo é gerado e retornado no cabeçalho X-Cart-ID da resposta.
      - name: X-Guest-Cart-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Alias de cabeçalho para carrinho de visitante.
          title: X-Guest-Cart-Id
        description: Alias de cabeçalho para carrinho de visitante.
      responses:
        '200':
          description: Estado atual do carrinho de compras retornado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/cart/items:
    post:
      tags:
      - Cart
      summary: Adicionar produto ao carrinho
      description: 'Insere ou incrementa a quantidade de um cosmético no carrinho
        de compras no Redis:

        - Valida a existência do produto no catálogo ativo.

        - Verifica se a quantidade solicitada não excede o estoque disponível.

        - Recalcula automaticamente os subtotais e valor total da sacola.'
      operationId: add_item_api_cart_items_post
      parameters:
      - name: X-Cart-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: UUID identificador da sessão de carrinho no Redis. Se não enviado,
            um novo é gerado e retornado no cabeçalho X-Cart-ID da resposta.
          title: X-Cart-Id
        description: UUID identificador da sessão de carrinho no Redis. Se não enviado,
          um novo é gerado e retornado no cabeçalho X-Cart-ID da resposta.
      - name: X-Guest-Cart-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Alias de cabeçalho para carrinho de visitante.
          title: X-Guest-Cart-Id
        description: Alias de cabeçalho para carrinho de visitante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '201':
          description: Item adicionado com sucesso ao carrinho e estado atualizado
            retornado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '400':
          description: Requisição inválida (parâmetros ausentes, formato incorreto
            ou regra de negócio violada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Produto inexistente ou inativo no catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '422':
          description: Erro de validação semântica nos campos da requisição (Pydantic
            Validation Error).
  /api/cart/items/{product_id}:
    put:
      tags:
      - Cart
      summary: Atualizar quantidade de um item no carrinho
      description: 'Atualiza a quantidade de um cosmético específico presente no carrinho.

        Se a quantidade informada for zero ou negativa, o item é removido automaticamente
        da sacola.'
      operationId: update_item_api_cart_items__product_id__put
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: integer
          description: ID do cosmético a ter a quantidade alterada.
          examples:
          - 1
          title: Product Id
        description: ID do cosmético a ter a quantidade alterada.
      - name: X-Cart-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: UUID identificador da sessão de carrinho no Redis. Se não enviado,
            um novo é gerado e retornado no cabeçalho X-Cart-ID da resposta.
          title: X-Cart-Id
        description: UUID identificador da sessão de carrinho no Redis. Se não enviado,
          um novo é gerado e retornado no cabeçalho X-Cart-ID da resposta.
      - name: X-Guest-Cart-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Alias de cabeçalho para carrinho de visitante.
          title: X-Guest-Cart-Id
        description: Alias de cabeçalho para carrinho de visitante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Quantidade atualizada e novo total do carrinho calculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '400':
          description: Requisição inválida (parâmetros ausentes, formato incorreto
            ou regra de negócio violada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Produto não encontrado no catálogo para validação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '422':
          description: Erro de validação semântica nos campos da requisição (Pydantic
            Validation Error).
    delete:
      tags:
      - Cart
      summary: Remover produto do carrinho
      description: Remove integralmente uma linha de produto do carrinho no Redis
        e retorna a sacola atualizada com novos subtotais.
      operationId: remove_item_api_cart_items__product_id__delete
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: integer
          description: ID do produto a ser removido do carrinho.
          examples:
          - 1
          title: Product Id
        description: ID do produto a ser removido do carrinho.
      - name: X-Cart-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: UUID identificador da sessão de carrinho no Redis. Se não enviado,
            um novo é gerado e retornado no cabeçalho X-Cart-ID da resposta.
          title: X-Cart-Id
        description: UUID identificador da sessão de carrinho no Redis. Se não enviado,
          um novo é gerado e retornado no cabeçalho X-Cart-ID da resposta.
      - name: X-Guest-Cart-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Alias de cabeçalho para carrinho de visitante.
          title: X-Guest-Cart-Id
        description: Alias de cabeçalho para carrinho de visitante.
      responses:
        '200':
          description: Item excluído com sucesso e carrinho recalculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '404':
          description: Produto não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/checkout:
    post:
      tags:
      - Checkout
      summary: Processar checkout completo com reserva atômica de estoque
      description: 'Finaliza a compra dos itens do carrinho para a cliente autenticada:

        1. **Idempotência Garantida**: Valida o cabeçalho `Idempotency-Key` no Redis
        (TTL de 24h) prevenindo duplicidade de cobranças em retentativas de rede.

        2. **Reserva Atômica Anti-Overselling**: Bloqueia os estoques dos cosméticos
        via **Lua Script Atômico no Redis** (TTL de 30 minutos). Em caso de concorrência
        simultânea sem saldo, falha imediatamente com `409 Conflict / Esgotado`.

        3. **Criação do Pedido**: Registra o pedido no PostgreSQL com status `pending`.

        4. **Geração de Pagamento**: Emite o pagamento (Pix Copia e Cola / QR Code
        ou sessão Stripe) com tempo limite de 30 minutos.'
      operationId: process_checkout_api_checkout_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Chave única de idempotência (UUID) para garantir que cobranças
            ou pedidos duplicados não sejam executados acidentalmente.
          title: Idempotency-Key
        description: Chave única de idempotência (UUID) para garantir que cobranças
          ou pedidos duplicados não sejam executados acidentalmente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequestDTO'
      responses:
        '202':
          description: Pedido aceito e processado com reserva atômica de estoque e
            dados de pagamento gerados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponseDTO'
        '400':
          description: Requisição inválida (parâmetros ausentes, formato incorreto
            ou regra de negócio violada).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '401':
          description: Não autorizado (token JWT ausente, expirado ou assinatura inválida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '404':
          description: Um ou mais produtos solicitados não foram encontrados no catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '409':
          description: Estoque esgotado no milissegundo da compra (Anti-Overselling
            Redis Lock).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
        '422':
          description: Erro de validação semântica nos campos da requisição (Pydantic
            Validation Error).
  /api/checkout/direct:
    post:
      tags:
      - Checkout
      summary: Checkout direto de 1 clique ('Comprar Agora')
      description: 'Executa a finalização instantânea de 1 clique para um único cosmético
        sem passar pelo carrinho de compras:

        - Obtém reserva atômica imediata via Redis.

        - Cria o pedido e gera o QR Code / instrução de pagamento em milissegundos.

        - Otimizado para conversão móvel na Product Detail Page (PDP).'
      operationId: direct_checkout_api_checkout_direct_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
