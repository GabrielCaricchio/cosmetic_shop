        quantity:
          type: integer
          minimum: 1.0
          title: Quantity
          description: Quantidade.
          default: 1
          examples:
          - 1
        shipping_address:
          $ref: '#/components/schemas/ShippingAddressDTO'
          description: Endereço de entrega.
        payment_method:
          type: string
          title: Payment Method
          description: Método de pagamento ('pix' ou 'credit_card').
          default: pix
          examples:
          - pix
