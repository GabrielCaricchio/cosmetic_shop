          - pending
        shipping_address:
          additionalProperties: true
          type: object
          title: Shipping Address
          description: Endereço de entrega registrado no pedido.
        items:
          items:
            $ref: '#/components/schemas/OrderItemDetailDTO'
          type: array
          title: Items
          description: Lista de cosméticos inclusos no pedido.
          default: []
        payment_method:
          anyOf:
