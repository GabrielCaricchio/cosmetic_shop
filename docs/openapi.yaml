      description: 'Recebe notificações assíncronas de liquidação de pagamento enviadas
        pelo gateway financeiro:

        - Se o status for `approved`: o pedido avança para `paid`, as reservas de
        estoque no Redis são confirmadas e o estoque físico no PostgreSQL é decrementado
