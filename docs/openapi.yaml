        quantity:
          type: integer
          title: Quantity
          description: Quantidade adquirida.
          examples:
          - 2
        unit_price:
          type: string
          title: Unit Price
          description: Preço unitário congelado na data do pedido.
          examples:
          - 49.9
        subtotal:
          type: string
