          city: São Paulo
          complement: Apto 42B
          neighborhood: Bela Vista
          number: '1000'
          state: SP
          street: Avenida Paulista
          zip_code: 01310-100
    ErrorResponseDTO:
      properties:
        error:
          type: string
          title: Error
          description: 'Código padronizado do erro em maiúsculas (ex: BAD_REQUEST,
            NOT_FOUND, OUT_OF_STOCK, UNAUTHORIZED, FORBIDDEN, CONFLICT).'
          examples:
          - NOT_FOUND
        message:
          type: string
          title: Message
          description: Mensagem descritiva e amigável em português para exibição ou
            log.
          examples:
          - Produto 42 não encontrado
        details:
          anyOf:
          - {}
          - type: 'null'
          title: Details
          description: Informações complementares, validações de campos ou rastreamento
            interno de erro.
          examples:
          - field: product_id
            issue: Produto inativo ou inexistente
      type: object
      required:
      - error
      - message
      title: ErrorResponseDTO
      description: Modelo padrão para respostas de erro da API Aura Cosméticos.
      examples:
      - details:
          available: 0
          product_id: 1
          requested: 3
        error: OUT_OF_STOCK
        message: Estoque esgotado para o produto 'Batom Matte Red Velvet'.
      - error: UNAUTHORIZED
        message: Cabeçalho de autenticação ausente ou token inválido.
      - error: NOT_FOUND
        message: Recurso solicitado não foi encontrado no catálogo.
    HTTPValidationError:
      properties:
