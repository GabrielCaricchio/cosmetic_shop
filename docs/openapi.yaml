tags:
- name: Health
  description: Verificação de disponibilidade, conectividade e prontidão dos serviços
    essenciais da API.
- name: Auth
  description: Autenticação e cadastro de clientes e revendedoras com suporte a LGPD
    e tokens Bearer JWT.
- name: Catalog
  description: Navegação e busca de produtos de beleza com tolerância a erros e acentos
    via pg_trgm (PostgreSQL).
- name: Cart
  description: Gerenciamento de carrinho de compras baseado em sessão efêmera e volátil
    no Redis.
- name: Checkout
  description: Finalização de pedidos, reserva atômica de estoque (Redis Lua) e emissão
    de pagamentos.
- name: Orders
  description: Consulta do histórico e acompanhamento de pedidos em tempo real (Order
    Stepper).
- name: Webhooks
  description: Recepção de notificações assíncronas de gateways de pagamento (Pix
    / Stripe).
- name: Support
  description: Redirecionamento para atendimento e suporte ao cliente via WhatsApp
    oficial.
- name: Admin Auth
  description: Autenticação restrita e controle de acesso baseado em papéis (RBAC)
    para gestores.
- name: Admin Products
  description: Gestão operacional do catálogo de cosméticos (CRUD, fotos e controle
    de estoque).
- name: Admin Orders
  description: Operação e avanço no ciclo de vida de pedidos e expedição logística.
- name: Admin Reports
  description: Inteligência analítica de vendas, faturamento diário, ticket médio
    e séries temporais.
- name: Admin Inventory
  description: Auditoria em tempo real de travas atômicas e reservas temporárias no
    Redis.
