        total_pages: 6
    ProductCreateRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 2
          title: Name
          description: Nome do produto.
          examples:
          - Sérum Facial Antioxidante Vitamina C
        slug:
          anyOf:
          - type: string
            maxLength: 280
          - type: 'null'
          title: Slug
          description: Slug único amigável para URLs. Se omitido, é gerado a partir
            do nome.
          examples:
          - serum-facial-vitamina-c
        brand:
          type: string
          maxLength: 100
          minLength: 1
          title: Brand
          description: Nome da marca.
          default: Aura Cosméticos
          examples:
          - Aura Derm
        category_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Category Id
          description: ID da categoria associada.
          examples:
          - 2
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Texto descritivo de benefícios e aplicação.
          examples:
          - Sérum concentrado com 15% de Vitamina C pura e Ácido Ferúlico.
        ingredients:
          anyOf:
          - type: string
          - type: 'null'
          title: Ingredients
          description: Fórmula e lista de ingredientes INCI.
          examples:
          - Ascorbic Acid 15%, Ferulic Acid 0.5%, Hyaluronic Acid.
        price:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          title: Price
          description: Preço de venda em Reais (BRL).
          examples:
          - 89.9
        stock_quantity:
          type: integer
          minimum: 0.0
          title: Stock Quantity
          description: Quantidade inicial para estoque no banco e trava Redis.
          default: 0
          examples:
          - 100
        is_active:
          type: boolean
          title: Is Active
          description: Se o produto estará imediatamente visível na vitrine.
          default: true
          examples:
          - true
        image_urls:
          items:
            type: string
          type: array
          title: Image Urls
          description: Lista de URLs das fotos do produto.
          default: []
          examples:
          - - https://images.unsplash.com/photo-1620916566398-39f1143ab7be
        images:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Images
          description: Lista de objetos de imagem.
      type: object
      required:
      - name
      - price
      title: ProductCreateRequest
    ProductImageDTO:
      properties:
        image_id:
          type: integer
          title: Image Id
          description: Identificador único da imagem no banco de dados.
          examples:
          - 10
        image_url:
          type: string
          title: Image Url
          description: URL pública ou CDN da foto do cosmético.
          examples:
          - https://images.unsplash.com/photo-1586495777744-4413f21062fa
        is_primary:
          type: boolean
          title: Is Primary
          description: Indica se é a foto principal exibida no card do catálogo.
          examples:
          - true
        display_order:
          type: integer
          title: Display Order
          description: Ordem de exibição na galeria da PDP.
          examples:
          - 1
      type: object
      required:
      - image_id
      - image_url
      - is_primary
      - display_order
      title: ProductImageDTO
    ProductResponse:
      properties:
        product_id:
          type: integer
          title: Product Id
          description: ID único do cosmético.
          examples:
          - 1
        category_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Category Id
          description: ID da categoria a que pertence.
          examples:
          - 1
        name:
          type: string
          title: Name
          description: Nome comercial do cosmético.
          examples:
          - Batom Matte Velvet Red
        slug:
          type: string
          title: Slug
          description: Slug amigável para SEO e rota na loja.
          examples:
          - batom-matte-velvet-red
        brand:
          type: string
          title: Brand
          description: Marca ou fabricante parceiro do cosmético.
          examples:
          - Aura Glow
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Descrição detalhada dos benefícios, acabamento e textura.
          examples:
          - Batom líquido de longa duração com acabamento aveludado e alta pigmentação.
        ingredients:
          anyOf:
          - type: string
          - type: 'null'
          title: Ingredients
          description: Composição dermatológica completa (INCI) e modo de uso.
          examples:
          - Aqua, Dimethicone, Isododecane, Tocopherol (Vitamina E), Ácido Hialurônico.
        price:
          type: string
          title: Price
          description: Preço de venda unitário em Reais (BRL).
          examples:
          - 49.9
        stock_quantity:
          type: integer
          title: Stock Quantity
          description: Saldo físico disponível em estoque.
          examples:
          - 45
        is_active:
          type: boolean
          title: Is Active
          description: Disponibilidade para exibição e compra no e-commerce.
          examples:
          - true
        images:
          items:
            $ref: '#/components/schemas/ProductImageDTO'
          type: array
          title: Images
          description: Galeria de imagens do cosmético.
          default: []
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Data e hora de cadastro.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Data e hora da última modificação.
      type: object
      required:
      - product_id
      - name
      - slug
      - brand
      - price
      - stock_quantity
      - is_active
      - created_at
      - updated_at
      title: ProductResponse
      example:
        brand: Aura Glow
        category_id: 1
        created_at: '2026-11-16T08:00:00Z'
        description: Batom líquido de alta pigmentação com acabamento aveludado sem
          craquelar.
        images:
        - display_order: 1
          image_id: 1
          image_url: https://images.unsplash.com/photo-1586495777744-4413f21062fa
          is_primary: true
